run_name: track1_rank1_a100
seed: 20260502
track: track1

paths:
  manifest: data/manifests/track1_splits.csv
  output_dir: runs/track1_rank1_a100
  clip_download_root: checkpoints/openai_clip

data:
  image_size: 224
  split_train: train
  split_val_same: val_same
  split_val_identity: val_identity
  num_workers: 8
  pin_memory: true
  max_val_images_per_identity: 4
  max_val_identities: 1500

model:
  backbone_name: ViT-L/14
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.03
  lora_targets: qv
  train_ln: false
  train_visual_proj: false

loss:
  arcface_margin: 0.42
  arcface_scale: 64.0
  clip_preservation_weight: 0.0

train:
  epochs: 4
  identities_per_batch: 16
  images_per_identity: 2
  grad_accum_steps: 8
  lr_lora: 0.000015
  lr_head: 0.0001
  weight_decay: 0.01
  warmup_steps: 1000
  max_steps_per_epoch: 0
  log_every: 25
  val_every_epoch: 1
  amp: true
  grad_clip_norm: 1.0
